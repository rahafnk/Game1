<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Flappy Bird — a small HTML5 canvas remake with start screen, pause, and high-score saving." />
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="flappybird.js" defer></script>
</head>
<body>
    <h1>Flappy Bird</h1>
    <canvas id="board"></canvas>
    <p class="controls">
        <kbd>Space</kbd> / <kbd>↑</kbd> / tap to flap &nbsp;·&nbsp; <kbd>P</kbd> to pause
    </p>
</body>
</html>
